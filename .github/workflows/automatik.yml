name: Kursplaner-Automatik
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      monatsbericht_probe:
        description: "Probe-Monatsbericht für Monat JJJJ-MM (leer = normal)"
        required: false
        default: ""
      abschluesse:
        description: "Einmalig Monatsabschlüsse als PDF-Entwurf, Zeitraum JJJJ-MM:JJJJ-MM"
        required: false
        default: ""
      nachberechnen:
        description: "Einmalig Puffer neu berechnen, Zeitraum JJJJ-MM-TT:JJJJ-MM-TT (leer = normal)"
        required: false
        default: ""
      routenlinks:
        description: "Einmalig Routen-Links in Fahrt-Blöcke schreiben, Zeitraum JJJJ-MM-TT:JJJJ-MM-TT"
        required: false
        default: ""
      fahrten_probe:
        description: "Fahrten-Liste fürs Finanzamt für Jahr JJJJ sofort als PROBE-Entwurf"
        required: false
        default: ""
      strecken_probe:
        description: "ja = Kursstrecken berechnen und Abweichungen zeigen, sonst nichts"
        required: false
        default: ""
      hinweise_probe:
        description: "ja = Hinweise und Wochenvorschau sofort als PROBE-Entwurf anlegen"
        required: false
        default: ""
      nachberechnen_schreiben:
        description: "ja = Nachberechnung wirklich ausführen (sonst nur Probelauf)"
        required: false
        default: ""
concurrency: automatik
permissions:
  contents: read
  actions: write
jobs:
  planen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # GitHub schaltet geplante Läufe in öffentlichen Repos nach 60 Tagen ohne
      # Aktivität ab. Einmal am Tag "einschalten" setzt diese Frist zurück.
      - if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "05" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/automatik.yml/enable" && echo "Wachgehalten." || echo "::warning::Wachhalten fehlgeschlagen"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -z "$KURSPLANER_SECRET" ] || [ -z "$KURSPLANER_POSTFACH" ]; then echo "Noch nicht eingerichtet."; exit 0; fi
          node automatik/lauf.js
        env:
          KURSPLANER_SECRET: ${{ secrets.KURSPLANER_SECRET }}
          KURSPLANER_POSTFACH: ${{ secrets.KURSPLANER_POSTFACH }}
          KURSPLANER_HEIMADRESSE: ${{ secrets.KURSPLANER_HEIMADRESSE }}
          KURSPLANER_KONTAKTE: ${{ secrets.KURSPLANER_KONTAKTE }}
          SCHREIBEN: ${{ vars.SCHREIBEN }}
          MONATSBERICHT_PROBE: ${{ inputs.monatsbericht_probe }}
          NACHBERECHNEN: ${{ inputs.nachberechnen }}
          ROUTENLINKS: ${{ inputs.routenlinks }}
          HINWEISE_PROBE: ${{ inputs.hinweise_probe }}
          FAHRTEN_PROBE: ${{ inputs.fahrten_probe }}
          STRECKEN_PROBE: ${{ inputs.strecken_probe }}
          ABSCHLUESSE: ${{ inputs.abschluesse }}
          NACHBERECHNEN_SCHREIBEN: ${{ inputs.nachberechnen_schreiben }}
